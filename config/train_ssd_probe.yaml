base_config:
- config/train_ssd.yaml

# Two optimizer updates, each accumulating real Hypersim and VKITTI samples.
# No model checkpoints; memory_profile.json includes allocated optimizer state.
dataloader:
  effective_batch_size: 2
  num_workers: 0
trainer:
  memory_probe: true
  save_period: 0
  backup_period: 0
max_iter: 2
max_epoch: 1
lr_scheduler:
  kwargs:
    warmup_steps: 0
